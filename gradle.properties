org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# connect-client 1.1.0 declares minCompileSdk 36, so every module compiles against
# 36 while still targeting 35. AGP 8.7.3 was tested up to 35 and warns about
# anything newer; the warning is acknowledged here rather than left to repeat on
# every build. Raising AGP and Gradle is a change worth making on its own, not one
# to smuggle into a compileSdk bump.
android.suppressUnsupportedCompileSdk=36
